name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version im Manifest prüfen
        run: |
          v="${GITHUB_REF_NAME#v}"
          m=$(jq -r .version custom_components/wecker/manifest.json)
          test "$v" = "$m" || { echo "Tag $v passt nicht zu manifest.json $m"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
